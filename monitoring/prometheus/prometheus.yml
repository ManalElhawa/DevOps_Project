global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "jenkins"
    metrics_path: /prometheus/
    static_configs:
      # Replace "jenkins" with your actual Jenkins container name if different,
      # or use "host.docker.internal:8080" if Jenkins is outside this Docker network.
      - targets: ["jenkins-jenkins-1:8080"]